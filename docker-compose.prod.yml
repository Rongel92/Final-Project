# PRODUCTION — single container.
# The app listens on 8080 (plain HTTP) and is bound to 127.0.0.1 so it is only
# reachable by the TLS-terminating reverse proxy you put in front (step #1).
# Point the proxy (nginx/Traefik/App Gateway/ingress) at http://127.0.0.1:8080.
#
#   docker compose -f docker-compose.prod.yml up -d --build   # build + start
#   docker logs laptop-resale                                 # logs
#   docker compose -f docker-compose.prod.yml down            # stop
#
services:
  app:
    build: .
    image: laptop-resale:latest
    container_name: laptop-resale
    env_file:
      - ./deploy/prod.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - resale-data:/app/data
    restart: unless-stopped

volumes:
  resale-data:
